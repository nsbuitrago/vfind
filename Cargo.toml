[package]
name = "vfind"
version = "0.4.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "vfind"
crate-type = ["cdylib"]

[dependencies]
flate2 = "1.1.9"
indicatif = { version = "0.18.6", features = ["rayon"] }
log = "0.4.33"
memchr = "2.8.3"
parasail-rs = "0.9.1"
polars = "0.54.4"
pyo3 = { version = "0.28.2", features = ["extension-module"] }
pyo3-polars = { version = "0.27.0", default-features = false }
seq_io = "0.3.4"
